# =============================================================================
# Proyecto-Blockbuster — stack multimedia unificado
# Levantable con:  podman-compose up -d  (o `podman-compose up -d`)
# Spec Compose actual (sin atributo `version`, que está obsoleto).
#
# Estructura de DATA_ROOT esperada (ver README §"Estructura del host"):
#   ${DATA_ROOT}/torrents/        # zona de staging para descargas
#   ${DATA_ROOT}/media/movies/    # Radarr root 1 (Peliculas, opcional)
#   ${DATA_ROOT}/media/tv/        # Sonarr root 1 (Series, opcional)
#   ${DATA_ROOT}/media/music/     # Lidarr
#   ${DATA_ROOT}/media/books/     # Readarr
#   ${DATA_ROOT}/config/<servicio>/
#
# Si tu contenido YA existe con otra estructura (ej. /Peliculas, /Series en
# lugar de /media/movies, /media/tv), el .env puede apuntar a la carpeta
# padre y cada *Arr se configura en su UI con "Root Folders" apuntando a
# los subdirectorios reales. Ver README §"Adaptación a contenido existente".
# =============================================================================

# Valores comunes para los servicios LinuxServer (*Arr, Bazarr, Jackett).
x-arr-common: &arr-common
  restart: unless-stopped
  environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
  networks:
    - multimedia-net

services:

  # ---------------------------------------------------------------------------
  # Núcleo: servidor de medios
  # ---------------------------------------------------------------------------
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - multimedia-net
    ports:
      - "${JELLYFIN_PORT}:8096"
    environment:
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=http://localhost:${JELLYFIN_PORT}
    volumes:
      # Sintaxis larga para evitar que podman-compose en Windows interprete
      # los dos puntos de F:/ como separador de un volumen corto.
      - type: bind
        source: ${DATA_ROOT}/config/jellyfin
        target: /config
      # DATA_ROOT contiene la biblioteca completa (Peliculas, Series, Anime,
      # Hanime, Otros, Documentales). Jellyfin escanea la raíz y configura
      # una biblioteca por subcarpeta. Read-only para que Jellyfin no
      # modifique tu colección.
      - type: bind
        source: ${DATA_ROOT}
        target: /media
        read_only: true
      - type: bind
        source: ${DATA_ROOT}/torrents
        target: /torrents
        read_only: true

  # ---------------------------------------------------------------------------
  # Descubrimiento y peticiones
  # ---------------------------------------------------------------------------
  seerr:
    image: fallenbagel/jellyseerr:latest
    container_name: seerr
    restart: unless-stopped
    networks:
      - multimedia-net
    ports:
      - "${SEERR_PORT}:5055"
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - type: bind
        source: ${DATA_ROOT}/config/seerr
        target: /app/config

  # ---------------------------------------------------------------------------
  # Gestores automatizados de bibliotecas
  #
  # NOTA sobre root folders: el *Arr espera configurar uno o varios "Root
  # Folders" desde la UI. Por defecto montamos DATA_ROOT en /arr-data para
  # que el operador apunte cada *Arr a su subcarpeta real desde la UI
  # (ej. Radarr → /arr-data/Peliculas y /arr-data/Documentales,
  #       Sonarr → /arr-data/Series y /arr-data/Anime).
  # Si tu DATA_ROOT ya sigue /media/movies, /media/tv, los root folders
  # por defecto funcionan directamente.
  # ---------------------------------------------------------------------------
  sonarr:
    <<: *arr-common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "${SONARR_PORT}:8989"
    volumes:
      - type: bind
        source: ${DATA_ROOT}/config/sonarr
        target: /config
      - type: bind
        source: ${DATA_ROOT}/torrents
        target: /downloads
      - type: bind
        source: ${DATA_ROOT}
        target: /arr-data

  radarr:
    <<: *arr-common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "${RADARR_PORT}:7878"
    volumes:
      - type: bind
        source: ${DATA_ROOT}/config/radarr
        target: /config
      - type: bind
        source: ${DATA_ROOT}/torrents
        target: /downloads
      - type: bind
        source: ${DATA_ROOT}
        target: /arr-data

  lidarr:
    <<: *arr-common
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    ports:
      - "${LIDARR_PORT}:8686"
    volumes:
      - type: bind
        source: ${DATA_ROOT}/config/lidarr
        target: /config
      - type: bind
        source: ${DATA_ROOT}/torrents
        target: /downloads
      - type: bind
        source: ${DATA_ROOT}
        target: /arr-data

  readarr:
    <<: *arr-common
    # Readarr está archivado por upstream; la imagen `latest` ya no se publica.
    # Pin a la última build conocida (0.4.18-develop). Si falla, probar
    # `0.4.19-nightly` o cambiar a `ghcr.io/hotio/readarr`.
    image: lscr.io/linuxserver/readarr:0.4.18-develop
    container_name: readarr
    ports:
      - "${READARR_PORT}:8787"
    volumes:
      - type: bind
        source: ${DATA_ROOT}/config/readarr
        target: /config
      - type: bind
        source: ${DATA_ROOT}/torrents
        target: /downloads
      - type: bind
        source: ${DATA_ROOT}
        target: /arr-data

  # ---------------------------------------------------------------------------
  # Subtítulos
  # ---------------------------------------------------------------------------
  bazarr:
    <<: *arr-common
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    ports:
      - "${BAZARR_PORT}:6767"
    volumes:
      - type: bind
        source: ${DATA_ROOT}/config/bazarr
        target: /config
      - type: bind
        source: ${DATA_ROOT}
        target: /media

  # ---------------------------------------------------------------------------
  # Indexadores + evasión de Cloudflare
  # ---------------------------------------------------------------------------
  jackett:
    <<: *arr-common
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    ports:
      - "${JACKETT_PORT}:9117"
    volumes:
      - type: bind
        source: ${DATA_ROOT}/config/jackett
        target: /config
      - type: bind
        source: ${DATA_ROOT}/torrents
        target: /downloads

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    networks:
      - multimedia-net
    # IMPORTANTE: NO se publica ningún puerto al host. Solo accesible desde la
    # red interna `multimedia-net` a través de http://flaresolverr:8191.
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - type: bind
        source: ${DATA_ROOT}/config/flaresolverr
        target: /config

  # ---------------------------------------------------------------------------
  # Cliente de torrents
  #
  # NOTA IMPORTANTE sobre "Firewalled" en este stack:
  # En rootless Podman sobre WSL2, UPnP/SSDP multicast NO atraviesa
  # slirp4netns, asi que qBittorrent no puede pedirle al router que abra
  # el 6881 (log: "no router found"). Esto es una limitacion arquitectural
  # de WSL2 + podman-machine. `network_mode: host` no lo arregla (ademas
  # rompe la resolucion DNS para los Arr), asi que NO es una opcion.
  #
  # Solucion: configurar port forwarding MANUALMENTE en el router para
  # 6881 TCP+UDP -> IP-LAN-Windows (p. ej. <TU-IP-LAN>). Una sola vez.
  # La cadena inbound queda:
  #   Internet -> Router -> Windows:6881
  #   -> portproxy (setup-lan-access.ps1) -> WSL2 VM:6881
  #   -> rootlessport -> contenedor:6881 -> qBittorrent
  # Ver README §"qBittorrent aparece como Firewalled" para los detalles.
  # ---------------------------------------------------------------------------
  qbittorrent:
    <<: *arr-common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    ports:
      # IMPORTANTE: qBittorrent v5 valida estrictamente que el puerto del Host
      # header coincida con su puerto interno. Si el host usa un puerto distinto
      # al interno (ej. 9080:8080), rechaza TODAS las peticiones con 401
      # "Invalid Host header, port mismatch" antes de validar credenciales.
      # Por eso mapeamos el MISMO puerto en host y contenedor.
      - "${QBITTORRENT_PORT}:${QBITTORRENT_PORT}"
      # BitTorrent traffic. Si tu ISP filtra 6881, cambialo a otro (51413, etc.)
      # en la WebUI y en este docker-compose.yml simultaneamente, y actualiza
      # tambien la regla de port forwarding del router y el portproxy de
      # setup-lan-access.ps1.
      - "${QBITTORRENT_BT_PORT}:${QBITTORRENT_BT_PORT}"
      - "${QBITTORRENT_BT_PORT}:${QBITTORRENT_BT_PORT}/udp"
    volumes:
      - type: bind
        source: ${DATA_ROOT}/config/qbittorrent
        target: /config
      - type: bind
        source: ${DATA_ROOT}/torrents
        target: /downloads
    environment:
      - WEBUI_PORT=${QBITTORRENT_PORT}

  # ---------------------------------------------------------------------------
  # Monitoreo
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - multimedia-net
    volumes:
      - type: bind
        source: ${DATA_ROOT}/config/redis
        target: /data
    # Redis no expone puertos al host (solo accesible desde multimedia-net).

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    networks:
      - multimedia-net
    environment:
      - POSTGRES_DB=tracearr
      - POSTGRES_USER=tracearr
      - POSTGRES_PASSWORD=${TRACEARR_DB_PASSWORD}
      # PGDATA en un subdir del volumen named para evitar el error de
      # 'could not change permissions' que postgres da al inicializar
      # el data dir sobre NTFS/9P (WSL2).
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - tracearr-postgres:/var/lib/postgresql/data:z
    # Postgres no expone puertos al host (solo accesible desde multimedia-net).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracearr -d tracearr"]
      interval: 10s
      timeout: 5s
      retries: 5

  tracearr:
    image: ghcr.io/connorgallopo/tracearr:latest
    container_name: tracearr
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - multimedia-net
    ports:
      - "${TRACEARR_PORT}:3000"
    environment:
      - TZ=${TZ}
      # Tracearr usa PostgreSQL (no SQLite). El servicio 'postgres' arriba lo
      # provee; esta URL conecta con la DB 'tracearr' del usuario 'tracearr'.
      - DATABASE_URL=postgresql://tracearr:${TRACEARR_DB_PASSWORD}@postgres:5432/tracearr
      # JWT_SECRET firma las sesiones; en producción genera uno con
      # 'openssl rand -hex 32'.
      - JWT_SECRET=${TRACEARR_JWT_SECRET}
      # Redis para cache y rate limiting.
      - REDIS_URL=redis://redis:6379
      # URLs internas para conectar con los demás servicios.
      - JELLYFIN_URL=http://jellyfin:8096
      - SONARR_URL=http://sonarr:8989
    volumes:
      - type: bind
        source: ${DATA_ROOT}/config/tracearr
        target: /app/data

# =============================================================================
# Red interna compartida por todos los servicios. Los hostname entre
# contenedores se resuelven por nombre de servicio (ej. `http://jackett:9117`).
# =============================================================================
networks:
  multimedia-net:
    driver: bridge
    name: multimedia-net

# Named volumes para servicios que no pueden inicializar sobre NTFS/9P
# (Postgres requiere permisos POSIX estrictos en su data dir).
volumes:
  tracearr-postgres:
